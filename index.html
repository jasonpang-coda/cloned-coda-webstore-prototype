<!doctype html>
<html lang="en" data-theme="codm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKU Card 3.0</title>
    <link rel="icon" href="" />
    <!-- COD:M body font (headings/display stay on Hitmarker). Weights map to --sys-weight-*. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Rogue Trader body font. Heading/display uses local TT Supermolot Neue
         woff2 (src/stores/roguetrader/fonts/). See src/tokens/ds/themes/roguetrader.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- MGSSE heading font: the real URW DIN Semi-Condensed now loads
         locally (src/stores/mgsse/fonts/), see the @font-face block in
         src/tokens/ds/themes/mgsse.css. Oswald stays linked here only as
         the CSS fallback if a woff2 fails to load. Body uses system
         Helvetica/Arial, no link needed. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Diablo Immortal fonts. Heading proxies the licensed Exocet Immortal
         with Cinzel (no open-licence equivalent exists — see
         src/tokens/ds/themes/diabloimmortal.css). Body is Alegreya Sans, the
         real brand body font, free on Google Fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Alegreya+Sans:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Zenless Zone Zero fonts. Heading proxies the brand's self-hosted "en
         impact" custom display face with Anton (no open-licence equivalent
         exists — see src/tokens/ds/themes/zzz.css). Body proxies "en inpin"
         with Noto Sans. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
